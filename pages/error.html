<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>準備中</title>

    <link rel="stylesheet" href="css\event-detail.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #f5f4ef;
            color: #333;
            font-family: "Noto Sans JP", sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        header {
            position: absolute;
            top: 25px;
            right: 30px;
        }

        .detail-page {
            background: var(--paper);
            min-height: 100vh;
        }

        .detail-header {
            align-items: center;
            display: flex;
            justify-content: space-between;
            padding: 28px max(6vw, 22px);
        }

        .detail-back {
            color: #14252d;
            font: 11px 'DM Mono', monospace;
            letter-spacing: .1em;
            text-decoration: none;
        }

        .detail-back:hover {
            color: #ff876e;
        }

        .container {
            padding: 40px 20px;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 0.08em;
        }

        p {
            margin: 0;
            font-size: 15px;
            line-height: 2;
            color: #666;
            letter-spacing: 0.05em;
        }

        .sub {
            margin-top: 8px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>

    <header class="detail-header">
        <a class="detail-back" href="../index.html#events">
            ← BACK TO EVENTS
        </a>
    </header>

    <main class="container">
        <div class="icon">✦</div>

        <h1>ただいま準備中です</h1>

        <p>
            正式公開まで、もうしばらくお待ちください。<br>
            素敵なサイトになるよう準備を進めています。
        </p>

        <p class="sub">
            Coming Soon...
            <br>
            <br>
            <br>
            かわいくねこのページ<br>
            正式公開時はあんま使わないんだけどね…
        </p>
    </main>

</body>
</html>
